<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Último Filho Vermelho</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');
:root{
  --ink:#0d1316;--asf:#161f24;--conc:#24313a;--line:#33434d;
  --bone:#ece3cf;--dust:#9aa7ab;--sun:#e8a33d;--sun2:#f3c66f;--rust:#c4472f;--neon:#39d0c5;--leaf:#8fd16a;
  --head:"Bahnschrift","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);font:15px/1.45 var(--body)}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(232,163,61,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(57,208,197,.06),transparent 60%),var(--ink)}
#app{min-height:100%}
h1,h2,h3,h4,h5{font-family:var(--head);font-weight:700;letter-spacing:.02em;margin:.2em 0 .4em}
h4{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--sun);margin-top:1.2em}
.small{font-size:13px}.muted{color:var(--dust)}.bad{color:#ff8a72}.good{color:var(--leaf)}
.kicker{font:600 12px/1 var(--head);letter-spacing:.22em;text-transform:uppercase;color:var(--sun)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}
input{background:var(--asf);border:1px solid var(--line);color:var(--bone);padding:8px 10px;border-radius:4px;font:inherit;width:100%}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--sun);flex:none}
.lbl{display:block;font:600 11px var(--head);text-transform:uppercase;letter-spacing:.14em;color:var(--dust);margin:14px 0 6px}
.check{display:flex;gap:8px;align-items:center;margin:8px 0;cursor:pointer}.check.sm{font-size:12px;margin:0}
kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--dust)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin:2px 4px 2px 0;font-size:12px;background:var(--asf)}
.pill.w{border-color:#5a4a2c}
.tag{font-size:11px;padding:0 6px;border-radius:3px;margin-left:6px}.tag.good{background:#24401d;color:var(--leaf)}.tag.bad{background:#4a1d15;color:#ff8a72}
.btn{font:600 14px var(--head);letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:9px 16px;border:1px solid var(--line);background:var(--asf);color:var(--bone);cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--sun);color:var(--sun2)}
.btn.primary{background:var(--sun);border-color:var(--sun);color:#1b1206}.btn.primary:hover{background:var(--sun2);color:#1b1206}
.btn.danger{background:var(--rust);border-color:var(--rust)}
.btn.ghost{background:transparent}.btn.sm{padding:6px 11px;font-size:12px}.btn.xs{padding:3px 8px;font-size:11px}
.off{opacity:.38;pointer-events:none}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--conc);border:1px solid var(--sun);padding:8px 16px;border-radius:4px;z-index:99;animation:fade 2.2s}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}

/* abertura */
.title-screen{position:fixed;inset:0;display:grid;place-items:center;cursor:pointer;overflow:hidden;background:linear-gradient(180deg,rgba(13,19,22,.55),rgba(13,19,22,.92) 70%),var(--bg,none) center/cover no-repeat}
.sun{position:absolute;width:min(52vw,440px);aspect-ratio:1;border-radius:50%;background:linear-gradient(180deg,var(--sun2),var(--sun) 45%,var(--rust));top:6%;filter:drop-shadow(0 0 60px rgba(232,163,61,.35));overflow:hidden}
.sun i{position:absolute;left:0;right:0;height:3%;background:var(--ink)}.sun i:nth-child(1){top:58%}.sun i:nth-child(2){top:66%;height:4%}.sun i:nth-child(3){top:75%;height:5%}.sun i:nth-child(4){top:84%;height:6%}.sun i:nth-child(5){top:93%;height:7%}
.title-wrap{position:relative;text-align:center;margin-top:46vh}.title-wrap .kicker{color:var(--bone);text-shadow:0 2px 8px #000}
.title-screen h1{font-size:clamp(44px,8vw,104px);line-height:.9;text-transform:uppercase;letter-spacing:.03em;margin:.15em 0;text-shadow:0 4px 0 var(--rust),0 0 40px rgba(0,0,0,.8)}
.title-screen .sub{font:600 14px var(--head);letter-spacing:.3em;text-transform:uppercase;color:var(--neon)}
.title-screen .hint{margin-top:36px;color:var(--dust);font-size:13px;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}

/* menu */
.menu-screen{display:grid;grid-template-columns:minmax(280px,360px) 1fr;min-height:100vh;position:relative}
.menu{padding:34px 30px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(13,19,22,.75)}
.menu h2{font-size:30px;text-transform:uppercase;line-height:1;margin:.3em 0 1em;color:var(--bone)}
.menu ul{list-style:none;padding:0;margin:0}
.mitem{display:block;width:100%;text-align:left;background:none;border:0;color:var(--bone);font:700 22px var(--head);letter-spacing:.03em;text-transform:uppercase;padding:7px 0 7px 14px;cursor:pointer;border-left:3px solid transparent}
.mitem small{display:block;font:400 12px var(--body);text-transform:none;letter-spacing:0;color:var(--dust)}
.mitem:hover,.mitem.on{border-left-color:var(--sun);color:var(--sun2)}
.legal{margin-top:auto;font-size:11px;color:var(--dust)}
.mapwrap{display:grid;place-items:center;padding:30px}
.region{width:100%;max-width:820px;height:auto}
.region .sea{fill:var(--neon);opacity:.5;font:italic 14px var(--body)}
.region .city circle{fill:rgba(232,163,61,.12);stroke:var(--sun);stroke-width:1}
.region .city text,.region .lbl{fill:var(--bone);font:600 13px var(--head);text-anchor:middle;letter-spacing:.05em}
.region .lbl{text-anchor:start;fill:var(--dust)}.region .lbl.warn{fill:#ff8a72}
.region .actmark circle{fill:var(--ink);stroke:var(--rust);stroke-width:2}.region .actmark text{fill:var(--bone);font:700 12px var(--head);text-anchor:middle}
.region .actmark.done circle{fill:var(--rust)}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(480px,92vw);background:#121a1e;border-left:1px solid var(--line);padding:22px 24px;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.5);animation:slide .18s}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.panel header{display:flex;justify-content:space-between;align-items:center}
.panel h3{font-size:26px;text-transform:uppercase;margin:0;color:var(--sun2)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{display:flex;gap:8px;align-items:center;text-align:left;background:var(--asf);border:1px solid var(--line);color:var(--bone);border-radius:4px;padding:7px 9px;cursor:pointer}
.chip small{display:block;color:var(--dust);font-size:11px}.chip .g{color:var(--rc);font-size:20px;width:22px;text-align:center}
.chip.on{border-color:var(--rc);box-shadow:inset 3px 0 0 var(--rc);background:#1b262b}
.savecard,.herocard{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin:8px 0;background:var(--asf)}
.herocard{justify-content:flex-start;align-items:flex-start}.herocard .g{color:var(--rc);font-size:26px;width:30px}.herocard>div:nth-child(2){flex:1}
.herocard p{margin:4px 0}
.egroup h4{margin:10px 0 4px}.counter{display:grid;grid-template-columns:24px 1fr auto 24px auto;gap:6px;align-items:center;font-size:13px;padding:2px 0}
.eg{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#3b1a14;border:1px solid var(--rust);font:700 12px var(--head);color:#ffd3c8;margin-right:6px}
.notes{padding-left:18px;margin:6px 0}.notes li{margin:3px 0;font-size:13px}
.prose p{margin:.6em 0;line-height:1.6}.prose h4{margin-top:1.4em}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(5,8,10,.72);display:grid;place-items:center;z-index:50;padding:20px;animation:fadein .15s}
@keyframes fadein{from{opacity:0}}
.modal{background:#141c20;border:1px solid var(--line);border-top:3px solid var(--sun);border-radius:6px;padding:22px 26px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{width:min(860px,100%)}.modal.story{width:min(640px,100%)}
.modal h2{font-size:30px;text-transform:uppercase;line-height:1.05;margin:.2em 0 .5em;color:var(--sun2)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{text-align:left;background:var(--asf);border:1px solid var(--line);border-left:3px solid var(--sun);color:var(--bone);border-radius:4px;padding:10px 12px;cursor:pointer;font:inherit}
.opt:hover{background:#1d282e}.opt b{font-family:var(--head);font-size:16px;letter-spacing:.02em}.opt small{display:block;color:var(--dust);margin-top:2px}
.checks{background:var(--asf);border-radius:4px;padding:8px 12px;font:12px var(--mono);margin:10px 0}.checks b{font-family:var(--body)}
.elist{list-style:none;padding:0}.elist li{margin:5px 0}
.rewards{padding-left:18px}.loot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.lootc{background:var(--asf);border:1px solid var(--line);color:var(--bone);border-radius:5px;padding:10px;text-align:left;cursor:pointer;font:inherit}
.lootc b{display:block;font-family:var(--head)}.lootc small{color:var(--dust)}.lootc:hover{border-color:var(--sun)}
.lootc.chosen{border-color:var(--sun);opacity:1!important;box-shadow:0 0 0 2px var(--sun) inset}
.lvrow{border-bottom:1px solid var(--line);padding:8px 0}.lvrow .row{flex-wrap:wrap;margin-top:6px}
.shop{display:flex;flex-direction:column;gap:6px}
.offer{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--asf);margin:4px 0}
.offer.col{flex-direction:column;align-items:stretch}.offer small{display:block;color:var(--dust);font-size:12px}.offer .row{flex-wrap:wrap}
.sheet header{display:flex;gap:14px;align-items:center}.sheet .g.big{font-size:40px;color:var(--rc)}
.sheet h2{margin:0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0}
.statgrid div{background:var(--asf);border:1px solid var(--line);border-radius:4px;text-align:center;padding:4px 0}.statgrid small{display:block;color:var(--dust);font-size:10px;letter-spacing:.1em}.statgrid b{font:700 18px var(--mono)}
.skills{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}

/* barra de PV */
.hpbar{position:relative;height:6px;background:#2a1612;border-radius:3px;overflow:hidden;margin:4px 0}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--leaf)}.hpbar.grave i{background:var(--sun)}.hpbar.mortal i{background:var(--rust)}
.hpbar b{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.6)}

/* corrida */
.run-screen{display:grid;grid-template-columns:1fr minmax(320px,380px);height:100vh}
.mapcol{display:flex;flex-direction:column;min-height:0}
.maphead{padding:18px 26px 8px}.maphead h2{margin:0;font-size:28px;text-transform:uppercase}.maphead small{color:var(--dust)}
.mapscroll{flex:1;overflow:auto;display:flex;justify-content:center;padding:10px 0 30px}
.actmap{position:relative;width:420px;background:repeating-linear-gradient(0deg,transparent 0 63px,rgba(51,67,77,.35) 63px 64px);border:1px solid var(--line);border-radius:6px}
.actmap svg{position:absolute;inset:0}.actmap line{stroke:#3b4d57;stroke-width:2;stroke-dasharray:4 5}.actmap line.walked{stroke:var(--sun);stroke-dasharray:none}
.node{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:2px solid #4a5d68;background:var(--asf);color:var(--bone);font:700 17px var(--head);display:grid;place-items:center;cursor:default;padding:0}
.node.combate{color:#ffd3c8}.node.elite{border-color:var(--rust);color:var(--rust)}.node.evento{color:var(--neon)}.node.safehouse{color:var(--leaf)}.node.mercado{color:var(--sun2)}.node.ripper{color:#b48ce0}.node.esconderijo{color:var(--sun)}
.node.chefe{width:56px;height:56px;margin:-28px 0 0 -28px;border-color:var(--rust);background:#2a1310;color:#ff8a72;font-size:26px}
.node.visited{background:#2c2416;border-color:var(--sun)}.node.here{box-shadow:0 0 0 4px rgba(232,163,61,.35)}
.node.avail{cursor:pointer;border-color:var(--sun2);box-shadow:0 0 0 0 rgba(243,198,111,.6);animation:pulse 1.6s infinite}
.node.avail:hover{background:var(--sun);color:#1b1206}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(243,198,111,0)}}
.bosslabel{position:absolute;transform:translateX(-50%);white-space:nowrap;font:700 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:#ff8a72}
.diary{background:#11181c;border-left:1px solid var(--line);padding:16px 18px;overflow:auto}
.dhead{display:flex;justify-content:space-between;align-items:center}.dhead h3{margin:0;font-size:24px;text-transform:uppercase;color:var(--sun2)}
.dmeta{font-size:13px;margin:8px 0}
.pcard{display:grid;grid-template-columns:30px 1fr 12px;gap:8px;align-items:center;width:100%;text-align:left;background:var(--asf);border:1px solid var(--line);border-left:3px solid var(--rc);color:var(--bone);border-radius:4px;padding:7px 9px;margin:5px 0;cursor:pointer;font:inherit}
.pcard .g{font-size:20px;color:var(--rc);text-align:center}.pcard small{font-size:11px}.pcard.dead{opacity:.5}.pcard .chev{color:var(--dust)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:12px}.lg i{display:inline-block;width:18px;text-align:center;font-style:normal;margin-right:4px}
.lg.elite i,.lg.chefe i{color:var(--rust)}.lg.evento i{color:var(--neon)}.lg.safehouse i{color:var(--leaf)}.lg.mercado i,.lg.esconderijo i{color:var(--sun)}.lg.ripper i{color:#b48ce0}
.jlog{padding-left:18px;font-size:12px;color:var(--dust)}.jlog li{margin:2px 0}

/* combate */
.combat{--t:min(52px,calc((100vw - 590px)/16),calc((100vh - 230px)/10));display:grid;grid-template-columns:250px 1fr 300px;grid-template-rows:auto 1fr auto;height:100vh}
.ctop{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:#11181c;min-height:46px}
.rnd{font:700 20px var(--head);text-transform:uppercase;color:var(--sun2);white-space:nowrap}.ctitle{color:var(--dust);font-size:13px;white-space:nowrap}
.order{display:flex;gap:4px;flex:1;overflow:auto}
.oc{display:flex;gap:4px;align-items:center;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.oc i{font-style:normal;font-weight:700}.oc.party i{color:var(--neon)}.oc.enemy i{color:var(--rust)}.oc.now{border-color:var(--sun);background:#2c2416}.oc.gone{opacity:.3;text-decoration:line-through}
.ctrl{display:flex;gap:6px;align-items:center}
.cleft{padding:12px 14px;border-right:1px solid var(--line);overflow:auto;background:#11181c}
.up h3{font-size:18px;margin:0;line-height:1.1}.up h3 small{font:600 10px var(--head);letter-spacing:.18em;text-transform:uppercase;color:var(--sun)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin-top:6px}.kv span{color:var(--dust)}.kv b{font-weight:600}
.cleft hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.bwrap{display:grid;place-items:center;overflow:hidden;padding:10px}
.board{position:relative;width:calc(var(--t)*var(--w));height:calc(var(--t)*var(--h));border:1px solid var(--line);border-radius:4px;background:#182126}
.tiles{display:grid;grid-template-columns:repeat(16,var(--t));grid-template-rows:repeat(10,var(--t))}
.tile{border:1px solid rgba(51,67,77,.45);position:relative}
.tile.deco{background:linear-gradient(135deg,transparent 46%,rgba(154,167,171,.12) 47% 53%,transparent 54%)}
.tile.reach{background:rgba(57,208,197,.13);cursor:pointer}.tile.reach:hover{background:rgba(57,208,197,.3)}
.tile.tgt{cursor:crosshair;box-shadow:inset 0 0 0 1px rgba(232,163,61,.55)}.tile.area{background:rgba(196,71,47,.35)}
.tile.ob i{position:absolute;inset:3px;border-radius:3px;display:grid;place-items:center;font-style:normal;color:var(--ink);font-weight:700}
.tile.ob.concreto i,.tile.ob.mureta i{background:repeating-linear-gradient(45deg,#7d8a90 0 6px,#6b787e 6px 12px)}
.tile.ob.mureta i{inset:12px 3px}
.tile.ob.aco i,.tile.ob.chapa i{background:linear-gradient(135deg,#9db0b9,#56666e)}.tile.ob.chapa i{inset:10px 3px}
.tile.ob.vidro i{background:rgba(57,208,197,.25);border:1px solid var(--neon)}
.tile.ob.madeira i{background:repeating-linear-gradient(0deg,#8a6a43 0 5px,#6f5434 5px 7px);inset:8px}
.tile.ob.carro i{background:linear-gradient(180deg,#7a3a2c,#3f2018);border-radius:8px}
.tile.ob.terminal i{background:#13302d;border:1px solid var(--neon);color:var(--neon);font-size:18px}
.tile.ob.servidor i{background:#20262a;border:1px solid #4d5b63;color:var(--neon)}
.units{position:absolute;inset:0;pointer-events:none}
.unit{position:absolute;left:calc(var(--t)*var(--x));top:calc(var(--t)*var(--y));width:var(--t);height:var(--t);display:grid;place-items:center;transition:left .1s linear,top .1s linear;pointer-events:auto;cursor:pointer}
.unit .ug{width:calc(var(--t)*.72);height:calc(var(--t)*.72);border-radius:50%;display:grid;place-items:center;font:700 calc(var(--t)*.36) var(--head);margin-top:-6px}
.unit.party .ug{background:#10282c;border:2px solid var(--rc,var(--neon));color:var(--rc,var(--neon))}
.unit.enemy .ug{background:#3b1a14;border:2px solid var(--rust);color:#ffd3c8}
.unit.elite .ug{border-width:3px;box-shadow:0 0 0 2px #2a1310,0 0 10px rgba(196,71,47,.6)}
.unit.chefe .ug{width:calc(var(--t)*.9);height:calc(var(--t)*.9);border:3px solid #ff8a72;box-shadow:0 0 16px rgba(196,71,47,.7)}
.unit .hpbar.u{position:absolute;bottom:3px;left:12%;right:12%;height:4px;margin:0}
.unit .ust{position:absolute;top:0;right:1px;font-size:10px;color:var(--sun2)}
.unit.active .ug{box-shadow:0 0 0 3px var(--sun),0 0 14px rgba(232,163,61,.7)}
.unit.tgt .ug{outline:2px dashed var(--sun2);outline-offset:3px;cursor:crosshair}
.unit.insp .ug{outline:1px solid var(--bone);outline-offset:2px}
.unit.mortal .ug{border-style:dashed;opacity:.75;animation:blink 1.2s infinite}
.unit.dying{opacity:0;transform:scale(.4);transition:.4s}
.fxl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fxl line.shot{stroke:var(--sun2);stroke-width:2}.fxl line.net{stroke:var(--neon);stroke-width:2;stroke-dasharray:4 4}.fxl line.melee{stroke:#ff8a72;stroke-width:4}
.fxl .boom{fill:rgba(232,163,61,.35);stroke:var(--rust);stroke-width:2;animation:fadein .2s reverse}
.float{position:absolute;transform:translate(-50%,-90%);font:800 18px var(--head);pointer-events:none;animation:up 1.1s forwards;text-shadow:0 2px 0 #000}
.float.dmg{color:#ff8a72}.float.blk{color:var(--dust)}.float.heal{color:var(--leaf)}.float.miss{color:var(--dust);font-size:14px}
@keyframes up{to{transform:translate(-50%,-220%);opacity:0}}
.tip{position:absolute;z-index:5;background:#0b1013;border:1px solid var(--sun);border-radius:4px;padding:6px 9px;font-size:12px;pointer-events:none;opacity:0;white-space:nowrap}.tip.on{opacity:1}
.cright{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#11181c;padding:10px 12px}
.cright h4{margin:0 0 6px}
#clog{flex:1;overflow:auto;margin:0;padding:0 0 0 2px;list-style:none;font:12px/1.45 var(--mono)}
#clog li{padding:3px 0;border-bottom:1px dashed rgba(51,67,77,.5);color:var(--dust)}
#clog li.roll{color:var(--bone)}#clog li.dmg{color:#ffb4a3}#clog li.good{color:var(--leaf)}#clog li.bad{color:#ff8a72;font-weight:700}#clog li.round{color:var(--sun);font-weight:700;text-transform:uppercase;border:0;margin-top:6px}#clog li.sys{color:#7f9aa3;font-style:italic}
.dicebox{display:flex;align-items:center;gap:10px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--dust)}
.dicebox b{display:grid;place-items:center;width:42px;height:42px;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);background:var(--conc);color:var(--bone);font:800 18px var(--mono)}
.dicebox.hit b{background:var(--sun);color:#1b1206}.dicebox.miss b{background:#3b1a14}
.cbot{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:4px 14px;border-top:1px solid var(--line);padding:8px 14px;background:#0f1518;min-height:118px}
.hand{display:flex;gap:16px;overflow-x:auto;grid-column:1}.cgroup h5{margin:0 0 4px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dust)}
.cards{display:flex;gap:6px}
.card{position:relative;width:118px;min-height:76px;text-align:left;background:linear-gradient(180deg,#1d282e,#151d21);border:1px solid var(--line);border-radius:5px;color:var(--bone);padding:16px 8px 6px;cursor:pointer;font:inherit;transition:.12s}
.card:hover{transform:translateY(-3px);border-color:var(--sun)}.card.sel{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun) inset;transform:translateY(-5px)}
.card b{display:block;font:700 13px/1.1 var(--head);letter-spacing:.02em}.card small{display:block;font-size:10px;color:var(--dust);line-height:1.25;margin-top:3px;max-height:38px;overflow:hidden}
.card .cost{position:absolute;top:3px;left:6px;font:700 9px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}.card .cost.F{color:var(--neon)}
.card .uses{position:absolute;top:3px;right:6px;font:700 10px var(--mono);color:var(--dust)}
.cbot .hint{grid-column:1;font-size:12px;color:var(--dust)}
.endbtn{grid-column:2;grid-row:1/3;align-self:stretch;min-width:140px;background:var(--rust);border:0;border-radius:6px;color:#fff;font:800 20px/1 var(--head);text-transform:uppercase;cursor:pointer;padding:10px 16px}
.endbtn small{display:block;font:500 11px var(--body);text-transform:none;opacity:.8;margin-top:4px}.endbtn:hover{filter:brightness(1.15)}
.waiting{grid-column:1;display:grid;place-items:center;color:var(--dust);font-style:italic}

/* fim */
.end-screen{max-width:720px;margin:0 auto;padding:12vh 24px;text-align:center}
.end-screen h1{font-size:clamp(36px,6vw,70px);text-transform:uppercase;line-height:1;color:var(--sun2);text-shadow:0 3px 0 var(--rust)}
.end-screen.bad h1{color:#ff8a72}.end-screen p{font-size:17px;line-height:1.6}

@media (max-width:900px){
  .menu-screen{grid-template-columns:1fr}.mapwrap{display:none}.run-screen{grid-template-columns:1fr;height:auto}.cols{grid-template-columns:1fr}
  .combat{--t:min(44px,calc((100vw - 20px)/16));grid-template-columns:1fr;grid-template-rows:auto auto auto auto auto;height:auto}
  .cleft,.cright{border:0;max-height:220px}.cbot{grid-template-columns:1fr}.endbtn{grid-column:1;grid-row:auto;min-height:56px}
}

.portrait.wide img{max-height:240px;object-position:50% 40%}.portrait{margin:10px 0 14px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0b1013}.portrait img{display:block;width:100%;max-height:300px;object-fit:cover;object-position:50% 20%}.portrait figcaption{font:600 11px var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--sun);padding:6px 10px}

.float.big{font-size:15px;letter-spacing:.08em;color:#ff6b62;white-space:nowrap;animation:up 1.8s forwards}
.range{width:100%;accent-color:var(--neon);border:0;padding:0;background:none}

/* ===== TEMA HUD NEON (visual próprio, inspirado em interfaces cyberpunk) ===== */
:root{
  --ink:#07080a;--asf:#0f0b0d;--conc:#1b1215;--line:#4a1a1c;
  --bone:#f4cfc8;--dust:#a3777a;--sun:#ff4a3d;--sun2:#ff8a7e;--rust:#ff2d24;--neon:#5ef1ff;--leaf:#6dffc4;
  --red:#ff4a3d;--redd:#5a1414;--cyan:#5ef1ff;--cyand:#0c3b42;--gold:#ffd23f;
  --head:"Rajdhani","Bahnschrift","Arial Narrow",system-ui,sans-serif;
  --body:"Rajdhani",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
  --cut:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
  --cut-s:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));
}
html,body{font:500 16px/1.4 var(--body);color:var(--bone)}
body{background:radial-gradient(1100px 520px at 70% -12%,rgba(255,74,61,.13),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(94,241,255,.06),transparent 60%),var(--ink)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
::selection{background:var(--cyan);color:#000}
h1,h2,h3,h4,h5{font-family:var(--head);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h2,h3{color:var(--red)}
h4{color:var(--cyan);letter-spacing:.18em;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:4px}
.kicker{color:var(--cyan);font-family:var(--mono);letter-spacing:.14em;font-weight:400}
.kicker::before{content:"// ";color:var(--red)}
.muted{color:var(--dust)}.good{color:var(--leaf)}.bad{color:#ff6b62}
kbd{font-family:var(--mono);border-color:var(--cyan);color:var(--cyan);border-radius:0}
input{background:#0b0809;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:0;color:var(--bone);font-family:var(--mono)}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 12px rgba(94,241,255,.25)}
.lbl{color:var(--red);font-family:var(--mono);font-weight:400;letter-spacing:.12em}
.pill{border-radius:0;clip-path:var(--cut-s);background:#140d0f;border-color:var(--line);color:var(--bone);font-family:var(--mono);font-size:12px}
.pill.w{border-color:var(--cyand);color:var(--cyan)}

/* botões */
.btn{border-radius:0;clip-path:var(--cut-s);background:rgba(255,74,61,.06);border:1px solid var(--red);color:var(--red);font:700 14px var(--head);letter-spacing:.14em}
.btn:hover{background:rgba(94,241,255,.10);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(94,241,255,.25)}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#041214}
.btn.primary:hover{background:#b8fbff;color:#041214}
.btn.danger{background:var(--red);border-color:var(--red);color:#1a0404}
.btn.ghost{background:transparent}

/* abertura */
.title-screen{background:linear-gradient(180deg,rgba(7,8,10,.55),rgba(7,8,10,.94) 72%),var(--bg,none) center/cover no-repeat}
.sun{background:linear-gradient(180deg,#ff8a7e,var(--red) 45%,#5a0f0f);filter:drop-shadow(0 0 70px rgba(255,74,61,.45))}
.sun i{background:var(--ink)}
.title-screen h1{color:var(--red);text-shadow:3px 0 0 rgba(94,241,255,.75),-2px 0 0 rgba(255,0,60,.6),0 0 28px rgba(255,74,61,.55);letter-spacing:.05em;animation:glitch 6s infinite steps(1)}
@keyframes glitch{0%,92%,100%{transform:none}93%{transform:translate(2px,-1px) skewX(-4deg)}95%{transform:translate(-3px,1px)}97%{transform:translate(1px,0) skewX(3deg)}}
.title-screen .sub{color:var(--cyan);font-family:var(--mono);font-weight:400}
.title-wrap .kicker{color:var(--bone)}
.title-screen .hint{font-family:var(--mono);color:var(--cyan)}

/* menu */
.menu{background:linear-gradient(90deg,rgba(14,6,8,.95),rgba(10,6,8,.78));border-right:1px solid var(--line);box-shadow:inset -1px 0 0 rgba(94,241,255,.08)}
.menu h2{color:var(--red);text-shadow:0 0 18px rgba(255,74,61,.4)}
.mitem{color:var(--red);font-weight:700;letter-spacing:.08em;border-left:0;padding-left:22px;position:relative;transition:.12s}
.mitem::before{content:"";position:absolute;left:4px;top:50%;width:8px;height:8px;margin-top:-4px;border:1px solid var(--line);transform:rotate(45deg)}
.mitem small{color:var(--dust);font-family:var(--mono);font-size:11px}
.mitem:hover,.mitem.on{color:var(--cyan);background:linear-gradient(90deg,rgba(94,241,255,.12),transparent 80%)}
.mitem:hover::before,.mitem.on::before{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.legal{font-family:var(--mono);font-size:10px}
.region .sea{fill:var(--cyan);font-family:var(--mono)}
.region .city circle{fill:rgba(255,74,61,.10);stroke:var(--red)}
.region .city text,.region .lbl{fill:var(--red);font-family:var(--head);letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.region .lbl{fill:var(--dust)}.region .lbl.warn{fill:var(--red)}
.region .actmark circle{fill:#0b0708;stroke:var(--cyan)}.region .actmark text{fill:var(--cyan)}
.region .actmark.done circle{fill:var(--cyan)}.region .actmark.done text{fill:#041214}
.panel{background:rgba(10,7,8,.97);border-left:1px solid var(--red);box-shadow:-30px 0 60px rgba(0,0,0,.6),inset 1px 0 0 rgba(94,241,255,.15)}
.panel h3{color:var(--red)}
.chip{border-radius:0;clip-path:var(--cut-s);background:#110b0d;border-color:var(--line)}
.chip.on{background:linear-gradient(90deg,rgba(94,241,255,.12),#110b0d);border-color:var(--cyan);box-shadow:inset 3px 0 0 var(--cyan)}
.savecard,.herocard,.offer,.opt,.lootc,.statgrid div,.checks{border-radius:0;clip-path:var(--cut-s);background:#110b0d;border-color:var(--line)}
.opt{border-left:3px solid var(--red)}.opt:hover{background:#0d1a1c;border-color:var(--cyan);border-left-color:var(--cyan)}
.opt b{color:var(--bone)}.opt:hover b{color:var(--cyan)}
.lootc:hover,.lootc.chosen{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.statgrid small{color:var(--red);font-family:var(--mono)}.statgrid b{color:var(--cyan)}
.eg{background:#2a0c0c;border-color:var(--red);color:#ffd6d1;border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

/* modal */
.overlay{background:rgba(4,3,4,.78);backdrop-filter:blur(2px)}
.modal{position:relative;border-radius:0;clip-path:var(--cut);background:linear-gradient(180deg,#120a0c,#0a0708);border:1px solid var(--red);border-top:2px solid var(--red);box-shadow:0 0 0 1px rgba(255,74,61,.15),0 30px 80px rgba(0,0,0,.7)}
.modal::before{content:"";position:absolute;left:6px;top:6px;width:14px;height:14px;border-left:2px solid var(--cyan);border-top:2px solid var(--cyan)}
.modal::after{content:"";position:absolute;right:6px;bottom:6px;width:14px;height:14px;border-right:2px solid var(--cyan);border-bottom:2px solid var(--cyan)}
.modal h2{color:var(--red);text-shadow:0 0 16px rgba(255,74,61,.35)}
.prose p{color:var(--bone);font-size:16px}
.portrait{border-radius:0;clip-path:var(--cut);border-color:var(--red);background:#000}
.portrait figcaption{color:var(--cyan);font-family:var(--mono);font-weight:400;border-top:1px solid var(--line)}
.toast{border-radius:0;clip-path:var(--cut-s);background:#0d1a1c;border-color:var(--cyan);color:var(--cyan);font-family:var(--mono)}

/* barras */
.hpbar{border-radius:0;background:#2a0b0b;height:7px}
.hpbar i{background:repeating-linear-gradient(90deg,var(--cyan) 0 6px,transparent 6px 8px);box-shadow:0 0 6px rgba(94,241,255,.5)}
.hpbar.grave i{background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 8px);box-shadow:0 0 6px rgba(255,210,63,.4)}
.hpbar.mortal i{background:repeating-linear-gradient(90deg,var(--red) 0 6px,transparent 6px 8px)}

/* jornada */
.maphead h2{color:var(--red)}.maphead small{color:var(--dust);font-family:var(--mono)}
.actmap{border-radius:0;clip-path:var(--cut);border-color:var(--line);background:repeating-linear-gradient(0deg,transparent 0 63px,rgba(255,74,61,.10) 63px 64px),linear-gradient(180deg,#0e0809,#090607)}
.actmap line{stroke:#5a2224}.actmap line.walked{stroke:var(--cyan);filter:drop-shadow(0 0 3px var(--cyan))}
.node{border-radius:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:#1a0c0e;border:0;color:var(--red);box-shadow:none;outline:1px solid transparent}
.node.combate{color:#ffb3ab}.node.elite{background:#3a0e0e;color:#ff6b62}.node.evento{color:var(--cyan)}.node.safehouse{color:var(--leaf)}.node.mercado{color:var(--gold)}.node.ripper{color:#d6a8ff}.node.esconderijo{color:var(--gold)}
.node.chefe{background:#4a0f0f;color:#ffd6d1}

.bosslabel{color:var(--red);font-family:var(--mono);font-weight:400;letter-spacing:.14em}

/* combate */
.ctop{background:linear-gradient(180deg,#140a0c,#0c0708);border-bottom:1px solid var(--red);box-shadow:0 1px 0 rgba(94,241,255,.12)}

.kv{font-family:var(--mono);font-size:11.5px}.kv span{color:var(--red)}.kv b{color:var(--bone);font-weight:400}
.board{border-radius:0;border:1px solid var(--red);background:#0a0607;box-shadow:0 0 0 1px rgba(255,74,61,.12),0 0 40px rgba(255,74,61,.08) inset}
.tile{border:1px solid rgba(255,74,61,.09)}
.tile.deco{background:linear-gradient(135deg,transparent 46%,rgba(255,74,61,.10) 47% 53%,transparent 54%)}

.tile.tgt{box-shadow:inset 0 0 0 1px rgba(255,210,63,.6)}.tile.area{background:rgba(255,74,61,.32)}
.tile.ob.concreto i,.tile.ob.mureta i{background:repeating-linear-gradient(45deg,#3a2a2c 0 5px,#2a1d1f 5px 10px);border:1px solid #5a3436}
.tile.ob.aco i,.tile.ob.chapa i{background:linear-gradient(135deg,#55474a,#231a1c);border:1px solid #7a5a5d}

.unit .ug{border-radius:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);font-family:var(--head)}

.unit.active .ug{background:#0b3a40;box-shadow:inset 0 0 0 2px var(--cyan)}

@keyframes spin{to{transform:rotate(360deg)}}
.unit.tgt .ug{outline:none;filter:drop-shadow(0 0 6px var(--gold))}
.unit.tgt::before{content:"";position:absolute;inset:1px;pointer-events:none;--g:var(--gold);background:linear-gradient(var(--g),var(--g)) 0 0/10px 2px,linear-gradient(var(--g),var(--g)) 0 0/2px 10px,linear-gradient(var(--g),var(--g)) 100% 0/10px 2px,linear-gradient(var(--g),var(--g)) 100% 0/2px 10px,linear-gradient(var(--g),var(--g)) 0 100%/10px 2px,linear-gradient(var(--g),var(--g)) 0 100%/2px 10px,linear-gradient(var(--g),var(--g)) 100% 100%/10px 2px,linear-gradient(var(--g),var(--g)) 100% 100%/2px 10px;background-repeat:no-repeat}
.unit .ust{color:var(--gold);font-family:var(--mono)}
.fxl line.shot{stroke:var(--gold)}.fxl line.net{stroke:var(--cyan)}.fxl line.melee{stroke:var(--red)}
.fxl .boom{fill:rgba(255,74,61,.3);stroke:var(--gold)}
.float{font-family:var(--head);font-weight:700}.float.dmg{color:var(--red);text-shadow:0 0 8px rgba(255,74,61,.8),0 2px 0 #000}.float.heal{color:var(--cyan)}
.tip{border-radius:0;clip-path:var(--cut-s);background:#071416;border-color:var(--cyan);color:var(--bone);font-family:var(--mono)}
.tip b{color:var(--cyan)}
.cright h4{border:0}
#clog{font-family:var(--mono)}#clog li{color:var(--dust);border-bottom-color:rgba(255,74,61,.12)}
#clog li.roll{color:var(--bone)}#clog li.dmg{color:var(--red)}#clog li.good{color:var(--cyan)}#clog li.bad{color:#ff6b62}#clog li.round{color:var(--cyan)}#clog li.sys{color:#8a6a6d}
.dicebox{font-family:var(--mono);border-top-color:var(--line)}
.dicebox b{background:#1b1215;color:var(--bone);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.dicebox.hit b{background:var(--cyan);color:#041214}.dicebox.miss b{background:var(--redd);color:#ffd6d1}
.cbot{background:linear-gradient(180deg,#0c0708,#070506);border-top:1px solid var(--red)}
.cgroup h5{color:var(--red);font-family:var(--mono);font-weight:400}
.card{border-radius:0;clip-path:var(--cut-s);background:linear-gradient(180deg,#160d10,#0d0809);border-color:var(--line)}
.card b{color:var(--bone)}
.card:hover{border-color:var(--cyan);background:linear-gradient(180deg,#0b2226,#081416)}.card:hover b{color:var(--cyan)}
.card.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset,0 0 18px rgba(94,241,255,.35);background:linear-gradient(180deg,#0b2a2f,#081416)}
.card .cost{color:var(--red);font-family:var(--mono);font-weight:400}.card .cost.F{color:var(--cyan)}
.card .uses{font-family:var(--mono);color:var(--gold)}
.cbot .hint{font-family:var(--mono);font-size:11px}
.endbtn{border-radius:0;clip-path:var(--cut);background:var(--red);color:#1a0404;letter-spacing:.08em;box-shadow:0 0 24px rgba(255,74,61,.35)}
.endbtn small{font-family:var(--mono)}
.endbtn:hover{background:#ff7166;filter:none}
.waiting{font-family:var(--mono);color:var(--cyan);font-style:normal}

/* fim */
.end-screen h1{color:var(--red);text-shadow:3px 0 0 rgba(94,241,255,.6),0 0 24px rgba(255,74,61,.5)}
.end-screen.bad h1{color:var(--red)}
.end-screen .portrait{max-width:520px;margin:20px auto}

/* fundo da região do ato */

// ---------- RNG com semente ----------
function hashStr(s) { let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let RNG = Math.random;
function seedRng(str) { RNG = mulberry32(hashStr(str)); }
function rnd() { return RNG(); }
function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function d6s(n) { const a = []; for (let i = 0; i < n; i++) a.push(ri(1, 6)); return a; }
function sum(a) { return a.reduce((x, y) => x + y, 0); }
function randomSeed() { const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
// d10 de Cyberpunk: 10 soma mais 1d10; 1 subtrai 1d10
function d10x() {
  const r = ri(1, 10);
  if (r === 10) { const e = ri(1, 10); return { v: 10 + e, txt: '10+' + e, crit: 'sucesso crítico' }; }
  if (r === 1) { const e = ri(1, 10); return { v: 1 - e, txt: '1−' + e, crit: 'falha crítica' }; }
  return { v: r, txt: String(r) };
}

// ---------- Personagens ----------
function makeHero(tplId) {
  const t = HERO_TEMPLATES.find(x => x.id === tplId);
  const h = JSON.parse(JSON.stringify({ id: t.id, name: t.name, role: t.role, stats: t.stats, skills: t.skills, weapons: t.weapons, armor: t.armor }));
  h.cyber = []; h.crits = []; h.level = 1; h.rank = 4; h.dead = false; h.bonusHP = 0;
  h.hp = hpMax(h); h.sp = armorMax(h);
  return h;

// ---------- Reforço de Chico depois de cada chefe ----------
function reinforceFlow(done) {
  const dead = J.party.filter(h => h.dead && !h.replaced);
  const used = J.party.map(h => h.id); const free = HERO_TEMPLATES.filter(t => !used.includes(t.id));
  if (!dead.length || !free.length) return done();
  UI.reinf = { done, left: Math.min(dead.length, free.length) };
  openModal(`<div class="kicker">Reforço</div><h2>Chico manda gente</h2><p class="prose">“Ninguém substitui quem caiu. Mas o trabalho não espera.” Escolha ${UI.reinf.left === 1 ? 'quem entra' : 'até ' + UI.reinf.left + ' pessoas'} no lugar de ${dead.map(h => esc(first(h.name))).join(' e ')}.</p>
    <div class="picker">${free.map(t => { const r = ROLES[t.role]; return `<button class="chip" data-a="reinfPick" data-id="${t.id}" style="--rc:${r.color}"><span class="g">${r.glyph}</span><span><b>${esc(first(t.name))}</b><small>${r.name}</small></span></button>`; }).join('')}</div>
    <div class="foot"><button class="btn ghost" data-a="reinfDone">Seguir sem reforço</button></div>`, 'lock');
}
ACT.reinfPick = d => {
  const dead = J.party.find(h => h.dead && !h.replaced); if (!dead) return;
  const lvl = Math.max(...J.party.filter(h => !h.dead).map(h => h.level), 1);
  const h = makeHero(d.id); for (let l = 1; l < lvl; l++) { heroLevelUp(h); const sk = levelUpOptions(h)[0]; h.skills[sk] = (h.skills[sk] || 0) + 1; }
  dead.replaced = true; J.party.push(h); J.stash.items.push(...HERO_TEMPLATES.find(t => t.id === d.id).items);
  jlog(`${h.name} entra no grupo.`); UI.reinf.left -= 1;
  if (UI.reinf.left <= 0) return ACT.reinfDone();
  reinforceFlow(UI.reinf.done);
};
ACT.reinfDone = () => { closeModal(); UI.reinf.done(); };

// ===== SONS (sintetizados com Web Audio, sem arquivos) =====
const SFX = (() => {
  let ctx = null, master = null, noiseBuf = null;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      ctx = new AC(); master = ctx.createGain(); master.connect(ctx.destination); setVol();
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return true;
    } catch (e) { return false; }
  }
  function setVol() { if (master) master.gain.value = (OPTS.sound === false ? 0 : (OPTS.vol === undefined ? 0.6 : OPTS.vol)) * 0.5; }
  function ok() { return ctx && OPTS.sound !== false && !OPTS.fast; }
  function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(freq, dur, type, peak, when, slideTo) {
    if (!ok()) return; const t = ctx.currentTime + (when || 0);
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    env(g, t, 0.005, peak || 0.2, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, peak, when, ftype, freq, freqTo, q) {
    if (!ok()) return; const t = ctx.currentTime + (when || 0);
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = ftype || 'lowpass';
    f.frequency.setValueAtTime(freq || 2000, t); if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t + dur); f.Q.value = q || 0.8;
    const g = ctx.createGain(); env(g, t, 0.003, peak || 0.4, dur); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
  }
  const shot = {
    pistol: w => { noise(0.12, 0.55, w, 'lowpass', 3500, 400); tone(140, 0.08, 'sine', 0.35, w, 60); },
    smg: w => { noise(0.07, 0.4, w, 'bandpass', 2500, 700, 1.2); tone(180, 0.05, 'square', 0.12, w, 90); },
    shotgun: w => { noise(0.35, 0.8, w, 'lowpass', 2200, 150); tone(90, 0.25, 'sine', 0.5, w, 40); },
    ar: w => { noise(0.14, 0.6, w, 'bandpass', 3200, 600, 0.9); tone(120, 0.1, 'sawtooth', 0.15, w, 50); },
    sniper: w => { noise(0.05, 0.8, w, 'highpass', 4000); noise(0.6, 0.35, (w || 0) + 0.03, 'lowpass', 1500, 120); tone(70, 0.4, 'sine', 0.4, w, 35); },
    melee: w => noise(0.18, 0.35, w, 'bandpass', 900, 3500, 2),
    brawl: w => { tone(110, 0.12, 'sine', 0.5, w, 50); noise(0.06, 0.3, w, 'lowpass', 800); }
  };
  return {
    init, setVol,
    click: () => tone(1250, 0.04, 'square', 0.06),
    hover: () => tone(1800, 0.02, 'square', 0.025),
    select: () => { tone(880, 0.05, 'square', 0.07); tone(1320, 0.06, 'square', 0.06, 0.05); },
    back: () => tone(600, 0.06, 'square', 0.06, 0, 380),
    shot: (type, mode) => {
      const f = shot[type] || shot.pistol;
      if (mode === 'autofire') { for (let i = 0; i < 6; i++) f(i * 0.06); }
      else f(0);
    },
    step: () => noise(0.04, 0.12, 0, 'bandpass', 500, 300, 2),
    hit: () => { tone(220, 0.08, 'square', 0.12, 0, 90); noise(0.08, 0.3, 0, 'lowpass', 1200); },
    block: () => { tone(1900, 0.12, 'triangle', 0.12, 0, 1500); tone(2600, 0.08, 'triangle', 0.06, 0.01); },
    miss: () => noise(0.15, 0.15, 0, 'bandpass', 3000, 900, 3),
    heal: () => { noise(0.35, 0.18, 0, 'highpass', 5000); tone(660, 0.12, 'sine', 0.12, 0.05); tone(990, 0.18, 'sine', 0.1, 0.14); },
    net: () => { for (let i = 0; i < 5; i++) tone(300 + Math.random() * 900, 0.04, 'square', 0.08, i * 0.035); },
    boom: () => { noise(0.9, 0.9, 0, 'lowpass', 1800, 60); tone(55, 0.7, 'sine', 0.7, 0, 30); },
    song: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.14, 'triangle', 0.12, i * 0.09)),
    spawn: () => tone(200, 0.25, 'sawtooth', 0.12, 0, 700),
    reload: () => { noise(0.05, 0.3, 0, 'bandpass', 2500, 2500, 4); noise(0.05, 0.3, 0.12, 'bandpass', 1800, 1800, 4); },
    mortal: () => { tone(440, 0.25, 'sawtooth', 0.15, 0, 220); tone(220, 0.4, 'sawtooth', 0.12, 0.2, 110); },
    death: () => { tone(330, 0.3, 'triangle', 0.2, 0, 160); tone(160, 0.8, 'sine', 0.25, 0.25, 50); },
    kill: () => tone(150, 0.2, 'sine', 0.25, 0, 50),
    save: () => { tone(523, 0.08, 'square', 0.08); tone(784, 0.12, 'square', 0.08, 0.08); },
    turn: () => { tone(740, 0.05, 'square', 0.06); tone(1110, 0.07, 'square', 0.06, 0.06); },
    win: () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.18, 'square', 0.08, i * 0.11)),
    lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, 'sawtooth', 0.1, i * 0.22)),
    coin: () => { tone(1500, 0.05, 'square', 0.07); tone(2000, 0.1, 'square', 0.07, 0.05); },
    node: () => { tone(500, 0.06, 'square', 0.07, 0, 900); }
  };
})();

// ===== INTERFACE DE COMBATE =====
let COMBAT_END = null;
function beginCombat(opts, onEnd) {
  UI.screen = 'combat'; UI.sel = null; UI.inspect = null; COMBAT_END = onEnd; closeModal();
  UIH = {
    update: () => drawCombat(),
    log: (t, k) => appendLog(t, k),
    fx: (k, d) => fx(k, d),
    end: res => { if (res === 'vitoria') SFX.win(); else SFX.lose(); setTimeout(() => { drawCombat(); COMBAT_END && COMBAT_END(res); }, OPTS.fast ? 10 : 900); },
    wait: ms => OPTS.fast ? new Promise(r => setTimeout(r, 0)) : new Promise(r => setTimeout(r, OPTS.reduce ? Math.min(ms, 60) : ms))
  };
  render(`<div class="combat">
    <header class="ctop" id="ctop"></header>
    <aside class="cleft" id="cleft"></aside>
    <main class="bwrap" style="${ACT_BG[opts.act] && typeof IMG !== 'undefined' ? `--actbg:url(${IMG[ACT_BG[opts.act]]})` : ''}"><div class="board" id="board" style="--w:${GW};--h:${GH}"><div class="tiles" id="tiles"></div><div class="units" id="units"></div><svg class="fxl" id="fxl"></svg><div class="tip" id="tip"></div></div></main>
    <aside class="cright"><h4>Registro</h4><ol id="clog"></ol><div class="dicebox" id="dicebox"><span>d10</span><b>–</b></div></aside>
    <footer class="cbot" id="cbot"></footer></div>`);
  startCombat(opts);
  if (opts.ambush) { C.units.filter(u => u.side === 'party').forEach(u => u.init += 20); C.order = C.units.slice().sort((a, b) => b.init - a.init).map(u => u.uid); log('Emboscada: o grupo age primeiro.', 'good'); }
  C.speed = OPTS.speed;
  drawCombat(); nextTurn();
}
function playerTurn() { const u = cur(); return C && !C.over && !C.busy && u && u.hero && u.side === 'party' && !C.auto; }

function drawCombat() {
  if (!C || UI.screen !== 'combat') return;
  const u = cur();
  // topo
  $('#ctop').innerHTML = `<b class="rnd">Rodada ${C.round}</b><span class="ctitle">${esc(C.title || '')}</span>
    <div class="order">${C.order.map(id => { const z = byId(id); if (!z) return ''; return `<span class="oc ${z.side} ${z === u ? 'now' : ''} ${alive(z) ? '' : 'gone'}" title="${esc(z.name)}"><i>${z.glyph}</i>${esc(z.short)}</span>`; }).join('')}</div>
    <div class="ctrl">${[1, 2, 4].map(s => `<button class="btn xs ${C.speed === s ? 'primary' : 'ghost'}" data-a="cspeed" data-s="${s}">${s}×</button>`).join('')}
      <label class="check sm"><input type="checkbox" data-a="cauto" ${C.auto ? 'checked' : ''}> IA joga o grupo</label>
      <label class="check sm"><input type="checkbox" data-a="csound" ${OPTS.sound !== false ? 'checked' : ''}> Som</label></div>`;
  // tabuleiro
  const T = targets();
  const reachSet = (playerTurn() && !UI.sel && u.moveLeft > 0) ? reach(u, u.moveLeft) : new Map();
  let th = '';
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const t = C.tiles[y][x]; const k = x + ',' + y; const o = t.ob;
    const cls = ['tile', t.deco ? 'deco' : '', reachSet.has(k) && reachSet.get(k).c > 0 ? 'reach' : '', T.tiles.has(k) ? 'tgt' : '', o ? 'ob ' + o.mat : ''].join(' ');
    th += `<div class="${cls}" data-a="tile" data-x="${x}" data-y="${y}">${o ? `<i style="opacity:${0.45 + 0.55 * o.hp / o.hpMax}">${o.mat === 'terminal' ? '⌗' : o.mat === 'servidor' ? '▤' : ''}</i>` : ''}</div>`;
  }
  $('#tiles').innerHTML = th;
  const layer = $('#units'); const seen = new Set();
  C.units.forEach(z => {
    let el = layer.querySelector(`[data-uid="${z.uid}"]`);
    if (!alive(z)) { if (el) { el.classList.add('dying'); setTimeout(() => el.remove(), 400); } return; }
    seen.add(String(z.uid));
    if (!el) { el = document.createElement('div'); el.dataset.uid = z.uid; el.dataset.a = 'unit'; layer.appendChild(el); }
    const mortal = isMortal(z);
    el.className = `unit ${z.side} ${z.tier} ${z === u ? 'active' : ''} ${T.units.has(z.uid) ? 'tgt' : ''} ${mortal ? 'mortal' : ''} ${UI.inspect === z.uid ? 'insp' : ''}`;
    el.style.setProperty('--x', z.x); el.style.setProperty('--y', z.y); if (z.color) el.style.setProperty('--rc', z.color);
    const stat = [z.st.stun ? '⚡' : '', z.st.shaken ? '!' : '', z.st.hino ? '♫' : '', z.st.pontoFraco ? '✦' : '', z.crits.length ? '✚' + z.crits.length : ''].join('');
    el.innerHTML = `<span class="ug">${z.glyph}</span>${hpBar(z.hp, z.hpMax, 'u')}${stat ? `<span class="ust">${stat}</span>` : ''}`;

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Último Filho Vermelho</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');
:root{
  --ink:#0d1316;--asf:#161f24;--conc:#24313a;--line:#33434d;
  --bone:#ece3cf;--dust:#9aa7ab;--sun:#e8a33d;--sun2:#f3c66f;--rust:#c4472f;--neon:#39d0c5;--leaf:#8fd16a;
  --head:"Bahnschrift","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);font:15px/1.45 var(--body)}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(232,163,61,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(57,208,197,.06),transparent 60%),var(--ink)}
#app{min-height:100%}
h1,h2,h3,h4,h5{font-family:var(--head);font-weight:700;letter-spacing:.02em;margin:.2em 0 .4em}
h4{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--sun);margin-top:1.2em}
.small{font-size:13px}.muted{color:var(--dust)}.bad{color:#ff8a72}.good{color:var(--leaf)}
.kicker{font:600 12px/1 var(--head);letter-spacing:.22em;text-transform:uppercase;color:var(--sun)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}
input{background:var(--asf);border:1px solid var(--line);color:var(--bone);padding:8px 10px;border-radius:4px;font:inherit;width:100%}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--sun);flex:none}
.lbl{display:block;font:600 11px var(--head);text-transform:uppercase;letter-spacing:.14em;color:var(--dust);margin:14px 0 6px}
.check{display:flex;gap:8px;align-items:center;margin:8px 0;cursor:pointer}.check.sm{font-size:12px;margin:0}
kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--dust)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin:2px 4px 2px 0;font-size:12px;background:var(--asf)}
.pill.w{border-color:#5a4a2c}
.tag{font-size:11px;padding:0 6px;border-radius:3px;margin-left:6px}.tag.good{background:#24401d;color:var(--leaf)}.tag.bad{background:#4a1d15;color:#ff8a72}
.btn{font:600 14px var(--head);letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:9px 16px;border:1px solid var(--line);background:var(--asf);color:var(--bone);cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--sun);color:var(--sun2)}
.btn.primary{background:var(--sun);border-color:var(--sun);color:#1b1206}.btn.primary:hover{background:var(--sun2);color:#1b1206}
.btn.danger{background:var(--rust);border-color:var(--rust)}
.btn.ghost{background:transparent}.btn.sm{padding:6px 11px;font-size:12px}.btn.xs{padding:3px 8px;font-size:11px}
.off{opacity:.38;pointer-events:none}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--conc);border:1px solid var(--sun);padding:8px 16px;border-radius:4px;z-index:99;animation:fade 2.2s}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}

/* abertura */
.title-screen{position:fixed;inset:0;display:grid;place-items:center;cursor:pointer;overflow:hidden;background:linear-gradient(180deg,rgba(13,19,22,.55),rgba(13,19,22,.92) 70%),var(--bg,none) center/cover no-repeat}
.sun{position:absolute;width:min(52vw,440px);aspect-ratio:1;border-radius:50%;background:linear-gradient(180deg,var(--sun2),var(--sun) 45%,var(--rust));top:6%;filter:drop-shadow(0 0 60px rgba(232,163,61,.35));overflow:hidden}
.sun i{position:absolute;left:0;right:0;height:3%;background:var(--ink)}.sun i:nth-child(1){top:58%}.sun i:nth-child(2){top:66%;height:4%}.sun i:nth-child(3){top:75%;height:5%}.sun i:nth-child(4){top:84%;height:6%}.sun i:nth-child(5){top:93%;height:7%}
.title-wrap{position:relative;text-align:center;margin-top:46vh}.title-wrap .kicker{color:var(--bone);text-shadow:0 2px 8px #000}
.title-screen h1{font-size:clamp(44px,8vw,104px);line-height:.9;text-transform:uppercase;letter-spacing:.03em;margin:.15em 0;text-shadow:0 4px 0 var(--rust),0 0 40px rgba(0,0,0,.8)}
.title-screen .sub{font:600 14px var(--head);letter-spacing:.3em;text-transform:uppercase;color:var(--neon)}
.title-screen .hint{margin-top:36px;color:var(--dust);font-size:13px;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}

/* menu */
.menu-screen{display:grid;grid-template-columns:minmax(280px,360px) 1fr;min-height:100vh;position:relative}
.menu{padding:34px 30px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(13,19,22,.75)}
.menu h2{font-size:30px;text-transform:uppercase;line-height:1;margin:.3em 0 1em;color:var(--bone)}
.menu ul{list-style:none;padding:0;margin:0}
.mitem{display:block;width:100%;text-align:left;background:none;border:0;color:var(--bone);font:700 22px var(--head);letter-spacing:.03em;text-transform:uppercase;padding:7px 0 7px 14px;cursor:pointer;border-left:3px solid transparent}
.mitem small{display:block;font:400 12px var(--body);text-transform:none;letter-spacing:0;color:var(--dust)}
.mitem:hover,.mitem.on{border-left-color:var(--sun);color:var(--sun2)}
.legal{margin-top:auto;font-size:11px;color:var(--dust)}
.mapwrap{display:grid;place-items:center;padding:30px}
.region{width:100%;max-width:820px;height:auto}
.region .sea{fill:var(--neon);opacity:.5;font:italic 14px var(--body)}
.region .city circle{fill:rgba(232,163,61,.12);stroke:var(--sun);stroke-width:1}
.region .city text,.region .lbl{fill:var(--bone);font:600 13px var(--head);text-anchor:middle;letter-spacing:.05em}
.region .lbl{text-anchor:start;fill:var(--dust)}.region .lbl.warn{fill:#ff8a72}
.region .actmark circle{fill:var(--ink);stroke:var(--rust);stroke-width:2}.region .actmark text{fill:var(--bone);font:700 12px var(--head);text-anchor:middle}
.region .actmark.done circle{fill:var(--rust)}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(480px,92vw);background:#121a1e;border-left:1px solid var(--line);padding:22px 24px;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.5);animation:slide .18s}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.panel header{display:flex;justify-content:space-between;align-items:center}
.panel h3{font-size:26px;text-transform:uppercase;margin:0;color:var(--sun2)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{display:flex;gap:8px;align-items:center;text-align:left;background:var(--asf);border:1px solid var(--line);color:var(--bone);border-radius:4px;padding:7px 9px;cursor:pointer}
.chip small{display:block;color:var(--dust);font-size:11px}.chip .g{color:var(--rc);font-size:20px;width:22px;text-align:center}
.chip.on{border-color:var(--rc);box-shadow:inset 3px 0 0 var(--rc);background:#1b262b}
.savecard,.herocard{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin:8px 0;background:var(--asf)}
.herocard{justify-content:flex-start;align-items:flex-start}.herocard .g{color:var(--rc);font-size:26px;width:30px}.herocard>div:nth-child(2){flex:1}
.herocard p{margin:4px 0}
.egroup h4{margin:10px 0 4px}.counter{display:grid;grid-template-columns:24px 1fr auto 24px auto;gap:6px;align-items:center;font-size:13px;padding:2px 0}
.eg{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#3b1a14;border:1px solid var(--rust);font:700 12px var(--head);color:#ffd3c8;margin-right:6px}
.notes{padding-left:18px;margin:6px 0}.notes li{margin:3px 0;font-size:13px}
.prose p{margin:.6em 0;line-height:1.6}.prose h4{margin-top:1.4em}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(5,8,10,.72);display:grid;place-items:center;z-index:50;padding:20px;animation:fadein .15s}
@keyframes fadein{from{opacity:0}}
.modal{background:#141c20;border:1px solid var(--line);border-top:3px solid var(--sun);border-radius:6px;padding:22px 26px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{width:min(860px,100%)}.modal.story{width:min(640px,100%)}
.modal h2{font-size:30px;text-transform:uppercase;line-height:1.05;margin:.2em 0 .5em;color:var(--sun2)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{text-align:left;background:var(--asf);border:1px solid var(--line);border-left:3px solid var(--sun);color:var(--bone);border-radius:4px;padding:10px 12px;cursor:pointer;font:inherit}
.opt:hover{background:#1d282e}.opt b{font-family:var(--head);font-size:16px;letter-spacing:.02em}.opt small{display:block;color:var(--dust);margin-top:2px}
.checks{background:var(--asf);border-radius:4px;padding:8px 12px;font:12px var(--mono);margin:10px 0}.checks b{font-family:var(--body)}
.elist{list-style:none;padding:0}.elist li{margin:5px 0}
.rewards{padding-left:18px}.loot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.lootc{background:var(--asf);border:1px solid var(--line);color:var(--bone);border-radius:5px;padding:10px;text-align:left;cursor:pointer;font:inherit}
.lootc b{display:block;font-family:var(--head)}.lootc small{color:var(--dust)}.lootc:hover{border-color:var(--sun)}
.lootc.chosen{border-color:var(--sun);opacity:1!important;box-shadow:0 0 0 2px var(--sun) inset}
.lvrow{border-bottom:1px solid var(--line);padding:8px 0}.lvrow .row{flex-wrap:wrap;margin-top:6px}
.shop{display:flex;flex-direction:column;gap:6px}
.offer{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--asf);margin:4px 0}
.offer.col{flex-direction:column;align-items:stretch}.offer small{display:block;color:var(--dust);font-size:12px}.offer .row{flex-wrap:wrap}
.sheet header{display:flex;gap:14px;align-items:center}.sheet .g.big{font-size:40px;color:var(--rc)}
.sheet h2{margin:0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0}
.statgrid div{background:var(--asf);border:1px solid var(--line);border-radius:4px;text-align:center;padding:4px 0}.statgrid small{display:block;color:var(--dust);font-size:10px;letter-spacing:.1em}.statgrid b{font:700 18px var(--mono)}
.skills{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}

/* barra de PV */
.hpbar{position:relative;height:6px;background:#2a1612;border-radius:3px;overflow:hidden;margin:4px 0}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--leaf)}.hpbar.grave i{background:var(--sun)}.hpbar.mortal i{background:var(--rust)}
.hpbar b{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.6)}

/* corrida */
.run-screen{display:grid;grid-template-columns:1fr minmax(320px,380px);height:100vh}
.mapcol{display:flex;flex-direction:column;min-height:0}
.maphead{padding:18px 26px 8px}.maphead h2{margin:0;font-size:28px;text-transform:uppercase}.maphead small{color:var(--dust)}
.mapscroll{flex:1;overflow:auto;display:flex;justify-content:center;padding:10px 0 30px}
.actmap{position:relative;width:420px;background:repeating-linear-gradient(0deg,transparent 0 63px,rgba(51,67,77,.35) 63px 64px);border:1px solid var(--line);border-radius:6px}
.actmap svg{position:absolute;inset:0}.actmap line{stroke:#3b4d57;stroke-width:2;stroke-dasharray:4 5}.actmap line.walked{stroke:var(--sun);stroke-dasharray:none}
.node{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:2px solid #4a5d68;background:var(--asf);color:var(--bone);font:700 17px var(--head);display:grid;place-items:center;cursor:default;padding:0}
.node.combate{color:#ffd3c8}.node.elite{border-color:var(--rust);color:var(--rust)}.node.evento{color:var(--neon)}.node.safehouse{color:var(--leaf)}.node.mercado{color:var(--sun2)}.node.ripper{color:#b48ce0}.node.esconderijo{color:var(--sun)}
.node.chefe{width:56px;height:56px;margin:-28px 0 0 -28px;border-color:var(--rust);background:#2a1310;color:#ff8a72;font-size:26px}
.node.visited{background:#2c2416;border-color:var(--sun)}.node.here{box-shadow:0 0 0 4px rgba(232,163,61,.35)}
.node.avail{cursor:pointer;border-color:var(--sun2);box-shadow:0 0 0 0 rgba(243,198,111,.6);animation:pulse 1.6s infinite}
.node.avail:hover{background:var(--sun);color:#1b1206}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(243,198,111,0)}}
.bosslabel{position:absolute;transform:translateX(-50%);white-space:nowrap;font:700 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:#ff8a72}
.diary{background:#11181c;border-left:1px solid var(--line);padding:16px 18px;overflow:auto}
.dhead{display:flex;justify-content:space-between;align-items:center}.dhead h3{margin:0;font-size:24px;text-transform:uppercase;color:var(--sun2)}
.dmeta{font-size:13px;margin:8px 0}
.pcard{display:grid;grid-template-columns:30px 1fr 12px;gap:8px;align-items:center;width:100%;text-align:left;background:var(--asf);border:1px solid var(--line);border-left:3px solid var(--rc);color:var(--bone);border-radius:4px;padding:7px 9px;margin:5px 0;cursor:pointer;font:inherit}
.pcard .g{font-size:20px;color:var(--rc);text-align:center}.pcard small{font-size:11px}.pcard.dead{opacity:.5}.pcard .chev{color:var(--dust)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:12px}.lg i{display:inline-block;width:18px;text-align:center;font-style:normal;margin-right:4px}
.lg.elite i,.lg.chefe i{color:var(--rust)}.lg.evento i{color:var(--neon)}.lg.safehouse i{color:var(--leaf)}.lg.mercado i,.lg.esconderijo i{color:var(--sun)}.lg.ripper i{color:#b48ce0}
.jlog{padding-left:18px;font-size:12px;color:var(--dust)}.jlog li{margin:2px 0}

/* combate */
.combat{--t:min(52px,calc((100vw - 590px)/16),calc((100vh - 230px)/10));display:grid;grid-template-columns:250px 1fr 300px;grid-template-rows:auto 1fr auto;height:100vh}
.ctop{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:#11181c;min-height:46px}
.rnd{font:700 20px var(--head);text-transform:uppercase;color:var(--sun2);white-space:nowrap}.ctitle{color:var(--dust);font-size:13px;white-space:nowrap}
.order{display:flex;gap:4px;flex:1;overflow:auto}
.oc{display:flex;gap:4px;align-items:center;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.oc i{font-style:normal;font-weight:700}.oc.party i{color:var(--neon)}.oc.enemy i{color:var(--rust)}.oc.now{border-color:var(--sun);background:#2c2416}.oc.gone{opacity:.3;text-decoration:line-through}
.ctrl{display:flex;gap:6px;align-items:center}
.cleft{padding:12px 14px;border-right:1px solid var(--line);overflow:auto;background:#11181c}
.up h3{font-size:18px;margin:0;line-height:1.1}.up h3 small{font:600 10px var(--head);letter-spacing:.18em;text-transform:uppercase;color:var(--sun)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin-top:6px}.kv span{color:var(--dust)}.kv b{font-weight:600}
.cleft hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.bwrap{display:grid;place-items:center;overflow:hidden;padding:10px}
.board{position:relative;width:calc(var(--t)*var(--w));height:calc(var(--t)*var(--h));border:1px solid var(--line);border-radius:4px;background:#182126}
.tiles{display:grid;grid-template-columns:repeat(16,var(--t));grid-template-rows:repeat(10,var(--t))}
.tile{border:1px solid rgba(51,67,77,.45);position:relative}
.tile.deco{background:linear-gradient(135deg,transparent 46%,rgba(154,167,171,.12) 47% 53%,transparent 54%)}
.tile.reach{background:rgba(57,208,197,.13);cursor:pointer}.tile.reach:hover{background:rgba(57,208,197,.3)}
.tile.tgt{cursor:crosshair;box-shadow:inset 0 0 0 1px rgba(232,163,61,.55)}.tile.area{background:rgba(196,71,47,.35)}
.tile.ob i{position:absolute;inset:3px;border-radius:3px;display:grid;place-items:center;font-style:normal;color:var(--ink);font-weight:700}
.tile.ob.concreto i,.tile.ob.mureta i{background:repeating-linear-gradient(45deg,#7d8a90 0 6px,#6b787e 6px 12px)}
.tile.ob.mureta i{inset:12px 3px}
.tile.ob.aco i,.tile.ob.chapa i{background:linear-gradient(135deg,#9db0b9,#56666e)}.tile.ob.chapa i{inset:10px 3px}
.tile.ob.vidro i{background:rgba(57,208,197,.25);border:1px solid var(--neon)}
.tile.ob.madeira i{background:repeating-linear-gradient(0deg,#8a6a43 0 5px,#6f5434 5px 7px);inset:8px}
.tile.ob.carro i{background:linear-gradient(180deg,#7a3a2c,#3f2018);border-radius:8px}
.tile.ob.terminal i{background:#13302d;border:1px solid var(--neon);color:var(--neon);font-size:18px}
.tile.ob.servidor i{background:#20262a;border:1px solid #4d5b63;color:var(--neon)}
.units{position:absolute;inset:0;pointer-events:none}
.unit{position:absolute;left:calc(var(--t)*var(--x));top:calc(var(--t)*var(--y));width:var(--t);height:var(--t);display:grid;place-items:center;transition:left .1s linear,top .1s linear;pointer-events:auto;cursor:pointer}
.unit .ug{width:calc(var(--t)*.72);height:calc(var(--t)*.72);border-radius:50%;display:grid;place-items:center;font:700 calc(var(--t)*.36) var(--head);margin-top:-6px}
.unit.party .ug{background:#10282c;border:2px solid var(--rc,var(--neon));color:var(--rc,var(--neon))}
.unit.enemy .ug{background:#3b1a14;border:2px solid var(--rust);color:#ffd3c8}
.unit.elite .ug{border-width:3px;box-shadow:0 0 0 2px #2a1310,0 0 10px rgba(196,71,47,.6)}
.unit.chefe .ug{width:calc(var(--t)*.9);height:calc(var(--t)*.9);border:3px solid #ff8a72;box-shadow:0 0 16px rgba(196,71,47,.7)}
.unit .hpbar.u{position:absolute;bottom:3px;left:12%;right:12%;height:4px;margin:0}
.unit .ust{position:absolute;top:0;right:1px;font-size:10px;color:var(--sun2)}
.unit.active .ug{box-shadow:0 0 0 3px var(--sun),0 0 14px rgba(232,163,61,.7)}
.unit.tgt .ug{outline:2px dashed var(--sun2);outline-offset:3px;cursor:crosshair}
.unit.insp .ug{outline:1px solid var(--bone);outline-offset:2px}
.unit.mortal .ug{border-style:dashed;opacity:.75;animation:blink 1.2s infinite}
.unit.dying{opacity:0;transform:scale(.4);transition:.4s}
.fxl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fxl line.shot{stroke:var(--sun2);stroke-width:2}.fxl line.net{stroke:var(--neon);stroke-width:2;stroke-dasharray:4 4}.fxl line.melee{stroke:#ff8a72;stroke-width:4}
.fxl .boom{fill:rgba(232,163,61,.35);stroke:var(--rust);stroke-width:2;animation:fadein .2s reverse}
.float{position:absolute;transform:translate(-50%,-90%);font:800 18px var(--head);pointer-events:none;animation:up 1.1s forwards;text-shadow:0 2px 0 #000}
.float.dmg{color:#ff8a72}.float.blk{color:var(--dust)}.float.heal{color:var(--leaf)}.float.miss{color:var(--dust);font-size:14px}
@keyframes up{to{transform:translate(-50%,-220%);opacity:0}}
.tip{position:absolute;z-index:5;background:#0b1013;border:1px solid var(--sun);border-radius:4px;padding:6px 9px;font-size:12px;pointer-events:none;opacity:0;white-space:nowrap}.tip.on{opacity:1}
.cright{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#11181c;padding:10px 12px}
.cright h4{margin:0 0 6px}
#clog{flex:1;overflow:auto;margin:0;padding:0 0 0 2px;list-style:none;font:12px/1.45 var(--mono)}
#clog li{padding:3px 0;border-bottom:1px dashed rgba(51,67,77,.5);color:var(--dust)}
#clog li.roll{color:var(--bone)}#clog li.dmg{color:#ffb4a3}#clog li.good{color:var(--leaf)}#clog li.bad{color:#ff8a72;font-weight:700}#clog li.round{color:var(--sun);font-weight:700;text-transform:uppercase;border:0;margin-top:6px}#clog li.sys{color:#7f9aa3;font-style:italic}
.dicebox{display:flex;align-items:center;gap:10px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--dust)}

// ---------- RNG com semente ----------
function hashStr(s) { let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let RNG = Math.random;
function seedRng(str) { RNG = mulberry32(hashStr(str)); }
function rnd() { return RNG(); }
function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function d6s(n) { const a = []; for (let i = 0; i < n; i++) a.push(ri(1, 6)); return a; }
function sum(a) { return a.reduce((x, y) => x + y, 0); }
function randomSeed() { const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
// d10 de Cyberpunk: 10 soma mais 1d10; 1 subtrai 1d10
function d10x() {
  const r = ri(1, 10);
  if (r === 10) { const e = ri(1, 10); return { v: 10 + e, txt: '10+' + e, crit: 'sucesso crítico' }; }
  if (r === 1) { const e = ri(1, 10); return { v: 1 - e, txt: '1−' + e, crit: 'falha crítica' }; }
  return { v: r, txt: String(r) };
}

// ---------- Personagens ----------
function makeHero(tplId) {
  const t = HERO_TEMPLATES.find(x => x.id === tplId);
  const h = JSON.parse(JSON.stringify({ id: t.id, name: t.name, role: t.role, stats: t.stats, skills: t.skills, weapons: t.weapons, armor: t.armor }));
  h.cyber = []; h.crits = []; h.level = 1; h.rank = 4; h.dead = false; h.bonusHP = 0;
  h.hp = hpMax(h); h.sp = armorMax(h);
  return h;
}
function cyberFx(h, key) { return (h.cyber || []).reduce((s, c) => s + ((CYBERWARE[c].effect[key]) || 0), 0); }
function humanity(h) { return h.stats.EMP * 10 - (h.cyber || []).reduce((s, c) => s + CYBERWARE[c].hum, 0); }
function stat(h, s) {
  let v = h.stats[s] + cyberFx(h, s);
  if (s === 'EMP') v = Math.max(0, Math.floor(humanity(h) / 10));
  if (['REF', 'DEX', 'MOVE'].includes(s)) v -= ARMORS[h.armor] ? ARMORS[h.armor].pen : 0;
  if (s === 'MOVE' && h.role === 'nomad') v += 1;
  return Math.max(0, v);
}
function hpMax(h) { return 10 + 5 * Math.ceil((stat(h, 'BODY') + h.stats.WILL) / 2) + (h.bonusHP || 0); }
function armorMax(h) {
  const a = ARMORS[h.armor] ? ARMORS[h.armor].sp : 0;
  const nat = cyberFx(h, 'natSP'), natB = cyberFx(h, 'natSPbody');
  return [Math.max(a, nat, natB), Math.max(a, nat)];
}

}

    }

function targets() {

async function act(fn) { C.busy = true; drawCombat(); try { await fn(); } catch (e) { console.error(e); } C.busy = false; const u = cur(); if (UI.sel && UI.sel.kind === 'atk' && u && u.shots > 0) { } else UI.sel = null; if (!C.over) drawCombat(); }

function center(z) { const el = $('#board'); const t = el.getBoundingClientRect().width / GW; return { x: (z.x + 0.5) * t, y: (z.y + 0.5) * t, t }; }
function floatText(z, txt, cls) { if (!OPTS.dice) return; const b = $('#board'); if (!b) return; const p = center(z); const el = document.createElement('div'); el.className = 'float ' + (cls || ''); el.textContent = txt; el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; b.appendChild(el); setTimeout(() => el.remove(), 1100); }

  else if (kind === 'boom') { const p = center(d); const c = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); c.setAttribute('x', p.x - 2.5 * p.t); c.setAttribute('y', p.y - 2.5 * p.t); c.setAttribute('width', 5 * p.t); c.setAttribute('height', 5 * p.t); c.setAttribute('class', 'boom'); svg.appendChild(c); setTimeout(() => c.remove(), 600); }
